name: Skill API Tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/skill-api-test.yml"
      - ".claude/skills/**"
      - "tests/skills/**"
      - "wandas/**"
  pull_request:
    paths:
      - ".github/workflows/skill-api-test.yml"
      - ".claude/skills/**"
      - "tests/skills/**"
      - "wandas/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install wandas
        run: pip install ./wandas

      - name: Install pytest
        run: pip install pytest

      - name: Run skill tests
        run: pytest tests/skills -v
